[project]
name = "machinelearn-phases"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ELW", email = "erik.weerda@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ising-mc",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[project.scripts]
machinelearn-phases = "machinelearn_phases:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
ising-mc = { path = "../ising_mc", editable = true }
